[phases.setup]
nixPkgs = ['nodejs_23', 'python3', 'gcc', 'pkg-config']

[phases.install]
cmds = ['rm -rf node_modules package-lock.json', 'npm install --no-audit']

[phases.build]
cmds = ['npm run build --workspace=apps/web', 'npm run build --workspace=apps/server']

[start]
cmd = 'cd apps/server && npm run start'
